stages:
  - build
  - test
  - deploy
  - dast

include:
  - project: vigigloo/gitlab-pipeline-fragments
    ref: v1
    file:
      # build
      - /docker.auto.yml

      # test
      - /proxy/license-scanning.yml
      - /proxy/code-quality.yml
      - /proxy/dependency-scanning.yml
      - /proxy/container-scanning.yml
      - /proxy/sast.yml
      - /proxy/secret-scanning.yml
      - /pnpm.auto.yml

      # deploy
      # - /helm.development.auto.yml
      # - /helm.production.auto.yml

variables:
  HELM_CHART: nodejs
  HELM_REPOSITORY: https://gitlab.com/api/v4/projects/29298483/packages/helm/stable
  HELM_NAME: app
  HOST: ${BASE_DOMAIN}
  HELM_INGRESS_HOST: ${HOST}
  HELM_ENV_VAR_NUXT_PUBLIC_APP_URL: https://${HOST}

# prepare git env to push new code to scalingo
.scalingo:
  image: ubuntu:latest
  before_script:
    - apt-get update
    - apt-get -y install bash curl git openssh-client
    - curl -O https://cli-dl.scalingo.com/install && bash install
    - scalingo login --api-token $SCALINGO_API_TOKEN
    - mkdir ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SCALINGO_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - echo $SCALINGO_SSH_HOST && ssh-keyscan $SCALINGO_SSH_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config user.name $GIT_USER_NAME
    - git config user.email $GIT_USER_EMAIL
    - git remote add scalingo $SCALINGO_GIT_REMOTE || true
    - git fetch origin $CI_COMMIT_BRANCH --unshallow
    - scalingo --region $SCALINGO_REGION --app $SCALINGO_APP_NAME env-set "NUXT_PUBLIC_VERSION_COMMIT_SHA=$CI_COMMIT_SHA"
    - scalingo --region $SCALINGO_REGION --app $SCALINGO_APP_NAME env-set "NUXT_PUBLIC_VERSION_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME"
    - |
        if [ !-z $CI_COMMIT_TAG ]
          then scalingo --region $SCALINGO_REGION --app $SCALINGO_APP_NAME env-set "NUXT_PUBLIC_VERSION_COMMIT_TAG=$CI_COMMIT_TAG"
        fi

.vigigloo:pnpm:install:
  image:
    name: registry.gitlab.com/vigigloo/tools/pnpm:node-18_pnpm-8.6.2

