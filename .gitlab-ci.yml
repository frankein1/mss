deploy:scalingo-dev:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: development
  only:
    - main
  script:
    - git checkout $CI_COMMIT_BRANCH
    - git push scalingo $CI_COMMIT_BRANCH:main -f

deploy:scalingo-demo:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: demo
  only:
    - tags
  script:
    - git checkout tags/$CI_COMMIT_TAG -b latest
    - git push scalingo latest:main -f

deploy:scalingo-prod:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: production
  when: manual
  needs: ['deploy:scalingo-demo']
  only:
    - tags
  script:
    - git checkout tags/$CI_COMMIT_TAG -b latest
    - git push scalingo latest:main -f
