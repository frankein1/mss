pnpm:test:
  extends: .vigigloo:pnpm:test
  interruptible: true
  needs: ['pnpm:install']
  services:
    - name: postgres:14.12-alpine
      alias: database
      variables:
        POSTGRES_DB: mss
        POSTGRES_USER: mss
        POSTGRES_PASSWORD: password
        POSTGRES_PORT: 5432
  variables:
    DATABASE_URL: postgresql://mss:password@database:5432/mss
    APP_URL: http://localhost:3000
  script:
    - pnpm prisma migrate deploy
    - pnpm prisma db seed
    - pnpm run --if-present test --coverage

.playwright-pnpm:install:
  variables:
    CACHE_FALLBACK_KEY: $CI_DEFAULT_BRANCH
  image: mcr.microsoft.com/playwright:v1.44.0-jammy
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/.pnpm
  before_script:
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm install --frozen-lockfile --prefer-offline

.playwright:test:
  extends: .playwright-pnpm:install
  stage: test
  cache:
    policy: pull
  artifacts:
    paths:
      - playwright-report
    expire_in: 1 week

playwright:install:
  extends: .playwright-pnpm:install
  stage: .pre
  interruptible: true
  script:
    - pnpm --version
    - node --version

pnpm:test:e2e:
  extends: .playwright:test
  needs: ['playwright:install']
  services:
    - name: postgres:14.12-alpine
      alias: database
      variables:
        POSTGRES_DB: mss
        POSTGRES_USER: mss
        POSTGRES_PASSWORD: password
        POSTGRES_PORT: 5432
  variables:
    DATABASE_URL: postgresql://mss:password@database:5432/mss
    APP_URL: http://localhost:3000
    AUTH_KEYCLOAK_ISSUER_URL: https://recette.connect.inclusion.beta.gouv.fr
    AUTH_KEYCLOAK_CLIENT_ID: demo
    AUTH_KEYCLOAK_CLIENT_SECRET: ${E2E_AUTH_KEYCLOAK_CLIENT_SECRET}
    STRUCTURE_MANAGER_EMAIL: jeanne.responsable@example.com
    STRUCTURE_MANAGER_PASSWORD: ${E2E_STRUCTURE_MANAGER_PASSWORD}
    SOCIAL_WORKER_EMAIL: jean.travailleur-social@example.com
    SOCIAL_WORKER_PASSWORD: ${E2E_SOCIAL_WORKER_PASSWORD}
  script:
    - pnpm prisma migrate deploy
    - pnpm prisma db seed
    - pnpm run --if-present test:e2e

deploy:scalingo-dev:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: development
  only:
    - main
  script:
    - git checkout $CI_COMMIT_BRANCH
    - git push scalingo $CI_COMMIT_BRANCH:main -f

deploy:scalingo-demo:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: demo
  only:
    - tags
  script:
    - git checkout tags/$CI_COMMIT_TAG -b latest
    - git push scalingo latest:main -f

deploy:scalingo-prod:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: production
  when: manual
  needs: ['deploy:scalingo-demo']
  only:
    - tags
  script:
    - git checkout tags/$CI_COMMIT_TAG -b latest
    - git push scalingo latest:main -f
