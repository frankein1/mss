stages:
  - build
  - test
  - deploy

include:
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

variables:
  # To be synced with engines.node constraint in package.json
  NODE_VERSION: 24.17.0
  NODE_SHA: ab343a1b747c7cbf3630dfd7dbf818c5423fab2eb4f5ad1afc896f6bd121a917
  # NODE_DOCKER_VERSION: 24.17.0-alpine
  NODE_DOCKER_SHA: sha256:156b55f92e98ccd5ef49578a8cea0df4679826564bad1c9d4ef04462b9f0ded6
  # To be synced with version in package.json
  # PLAYWRIGHT_VERSION: v1.60.0-noble
  PLAYWRIGHT_SHA: sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948
  # A synchroniser avec la version présente en production
  # POSTGRES_VERSION: 16.11-alpine
  POSTGRES_SHA: sha256:4327b9fd295502f326f44153a1045a7170ddbfffed1c3829798328556cfd09e
  # UBUNTU_VERSION: ubuntu:noble # 24.04.4 LTS (Noble Numbat)
  UBUNTU_SHA: sha256:186072bba1b2f436cbb91ef2567abca677337cfc786c86e107d25b7072feef0c
  # SONAR_VERSION: 12.0
  SONAR_SHA: sha256:97c145e4f8fe1786906c604272d17901e745051bc6c8173582f31aac8d0eb7fe

secret_detection:
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: 'true'

pnpm:install:
  image:
    name: node@${NODE_DOCKER_SHA}
  stage: .pre
  interruptible: true
  variables:
    CACHE_FALLBACK_KEY: $CI_DEFAULT_BRANCH
  before_script:
    - corepack enable
    - corepack prepare pnpm --activate
    - pnpm config set store-dir .pnpm-store
    - HUSKY=0 pnpm install --frozen-lockfile --prefer-offline
  script:
    - pnpm --version
  cache:
    key:
      files:
        - package.json
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

# prepare git env to push new code to scalingo
.scalingo:
  image: ubuntu@${UBUNTU_SHA}
  before_script:
    - apt-get update
    - apt-get -y install bash curl git openssh-client
    - curl -O https://cli-dl.scalingo.com/install && bash install
    - scalingo login --api-token $SCALINGO_API_TOKEN
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SCALINGO_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - echo $SCALINGO_SSH_HOST && ssh-keyscan $SCALINGO_SSH_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config user.name $GIT_USER_NAME
    - git config user.email $GIT_USER_EMAIL
    - git remote add scalingo $SCALINGO_GIT_REMOTE || true
    - git fetch origin $CI_COMMIT_BRANCH --unshallow
    - scalingo --region $SCALINGO_REGION --app $SCALINGO_APP_NAME env-set "NUXT_PUBLIC_VERSION_COMMIT_SHA=$CI_COMMIT_SHA"
    - scalingo --region $SCALINGO_REGION --app $SCALINGO_APP_NAME env-set "NUXT_PUBLIC_VERSION_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME"
    - |
      if [ -n "$CI_COMMIT_TAG" ]
      then
        scalingo --region $SCALINGO_REGION --app $SCALINGO_APP_NAME env-set "NUXT_PUBLIC_VERSION_COMMIT_TAG=$CI_COMMIT_TAG"
      fi

pnpm:lint:
  extends: pnpm:install
  stage: test
  cache:
    policy: pull
  script:
    - pnpm lint

pnpm:test:
  extends: ['pnpm:install']
  needs: ['pnpm:install']
  stage: test
  services:
    - name: postgres@${POSTGRES_SHA}
      alias: database
      variables:
        POSTGRES_DB: mss
        POSTGRES_USER: mss
        POSTGRES_PASSWORD: password
        POSTGRES_PORT: 5432
  variables:
    DATABASE_URL: postgresql://mss:password@database:5432/mss
    NUXT_PUBLIC_APP_URL: http://localhost:3000
  script:
    - if [[ ! -e /lib/libssl.so.3 ]]; then ln -s /usr/lib/libssl.so.3 /lib/libssl.so.3; else echo "Link already exists"; fi
    - pnpm prisma migrate deploy
    - pnpm prisma db seed
    - pnpm run --if-present test --coverage
  cache:
    policy: pull
  artifacts:
    paths:
      - coverage
    expire_in: 1 week

sonarcloud-check:
  stage: test
  variables:
    GIT_DEPTH: '0'
  image:
    name: sonarsource/sonar-scanner-cli@${SONAR_SHA}
    entrypoint: ['']
  cache:
    key: '${CI_JOB_NAME}'
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  needs:
    - job: pnpm:test
      artifacts: true
  rules:
    # Runs on default branch and on branches that are not empty
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      changes:
        compare_to: 'refs/heads/main'
        paths:
          - '**/*'

.test:e2e:
  image:
    name: mcr.microsoft.com/playwright@${PLAYWRIGHT_SHA}
  interruptible: true
  services:
    - name: postgres@${POSTGRES_SHA}
      alias: database
      variables:
        POSTGRES_DB: mss
        POSTGRES_USER: mss
        POSTGRES_PASSWORD: password
        POSTGRES_PORT: 5432
  before_script:
    - apt update && apt install -y xz-utils
    - curl -fsSL -o /tmp/node.tar.xz https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz
    - echo "${NODE_SHA}  /tmp/node.tar.xz" | sha256sum -c -
    - tar -xJf /tmp/node.tar.xz -C /usr/local --strip-components=1
    - rm -f /tmp/node.tar.xz
    - node -v
    - corepack enable
    - corepack prepare pnpm --activate
    - pnpm -v
    - pnpm config set store-dir .pnpm-store
    - HUSKY=0 pnpm install --frozen-lockfile --prefer-offline
  variables:
    DATABASE_URL: postgresql://mss:password@database:5432/mss
    NUXT_PUBLIC_APP_URL: http://localhost:3000
    NUXT_PUBLIC_LANDING_PAGE_URL: http://
    NUXT_AUTH_JWT_KEY: test-auth
  cache:
    key:
      files:
        - package.json
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  artifacts:
    when: on_failure
    paths:
      - playwright-report
    expire_in: 1 week

pnpm:test:e2e:
  extends: ['.test:e2e']
  stage: test
  script:
    - pnpm prisma migrate deploy
    - pnpm prisma db seed
    - pnpm playwright test --grep-invert "a11y.spec.ts"

pnpm:test:e2e:accessibility:
  extends: ['.test:e2e']
  stage: .post
  allow_failure: true
  script:
    - pnpm prisma migrate deploy
    - pnpm prisma db seed
    - pnpm run --if-present test:e2e -- e2e/a11y.spec.ts
  rules:
    - if: '$CI_COMMIT_REF_NAME == "main" || $CI_COMMIT_TAG'

deploy:scalingo-dev:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: development
  only:
    - main
  script:
    - git checkout $CI_COMMIT_BRANCH
    - git push scalingo $CI_COMMIT_BRANCH:main -f

deploy:scalingo-demo:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: demo
  only:
    - tags
  script:
    - git checkout tags/$CI_COMMIT_TAG -b latest
    - git push scalingo latest:main -f

deploy:scalingo-prod-hds:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: production-hds
  when: manual
  needs: ['deploy:scalingo-demo']
  only:
    - tags
  script:
    - git checkout tags/$CI_COMMIT_TAG -b latest
    - git push scalingo latest:main -f
