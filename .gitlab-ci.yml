stages:
  - build
  - test
  - deploy
  - dast

include:
  - project: vigigloo/gitlab-pipeline-fragments
    ref: v1
    file:
      # build
      - /docker.auto.yml

      # test
      - /proxy/license-scanning.yml
      - /proxy/code-quality.yml
      - /proxy/dependency-scanning.yml
      - /proxy/container-scanning.yml
      - /proxy/sast.yml
      - /proxy/secret-scanning.yml
      - /pnpm.auto.yml

      # deploy
      - /helm.reviews.auto.yml
      - /helm.development.auto.yml
      - /helm.production.auto.yml

variables:
  HELM_CHART: nodejs
  HELM_REPOSITORY: https://gitlab.com/api/v4/projects/29298483/packages/helm/stable
  HELM_NAME: app
  HOST: ${BASE_DOMAIN}
  HELM_INGRESS_HOST: ${HOST}
  HELM_ENV_VAR_NUXT_PUBLIC_APP_URL: https://${HOST}

.vigigloo:pnpm:install:
  image:
    name: registry.gitlab.com/vigigloo/tools/pnpm:node-18_pnpm-8.6.2

.vigigloo:helm:deploy:
  variables:
    HELM_UPGRADE_EXTRA_ARGS: >-
      --set "jobs.hooks.postInstall[0].image.repository=${CI_APPLICATION_REPOSITORY}-migrations"
      --set "jobs.hooks.postInstall[0].image.tag=${CI_APPLICATION_TAG}"
      --set "jobs.hooks.preUpgrade[0].image.repository=${CI_APPLICATION_REPOSITORY}-migrations"
      --set "jobs.hooks.preUpgrade[0].image.tag=${CI_APPLICATION_TAG}"
deploy:production:
  variables:
    HELM_UPGRADE_EXTRA_ARGS: >-
      --set "jobs.hooks.postInstall[0].image.repository=${CI_APPLICATION_REPOSITORY}/migrations"
      --set "jobs.hooks.postInstall[0].image.tag=${CI_APPLICATION_TAG}"
      --set "jobs.hooks.preUpgrade[0].image.repository=${CI_APPLICATION_REPOSITORY}/migrations"
      --set "jobs.hooks.preUpgrade[0].image.tag=${CI_APPLICATION_TAG}"

.vigigloo:docker:kaniko:build:
  parallel:
    matrix:
      - CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG
      - CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG-migrations
        DOCKERFILE: $CI_PROJECT_DIR/prisma/Dockerfile

docker:kaniko:build:production:
  parallel:
    matrix:
      - CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE
      - CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE/migrations
        DOCKERFILE: $CI_PROJECT_DIR/prisma/Dockerfile
