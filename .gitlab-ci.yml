stages:
  - build
  - test
  - deploy

include:
  - template: Code-Quality.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml

variables:
  NODE_VERSION: 22
  # A synchroniser avec la version présente dans package.json
  PLAYWRIGHT_VERSION: 1.55.0
  #A synchroniser avec la version présente en production
  POSTGRES_VERSION: 14.12

container_scanning:
  environment:
    name: development
  stage: .post
  variables:
    CS_IMAGE: $CONTAINER_SCANNING_IMAGE:$CI_COMMIT_SHA
    CS_REGISTRY_USER: $SCALINGO_USER_NAME
    CS_REGISTRY_PASSWORD: $SCALINGO_API_TOKEN
    SECURE_LOG_LEVEL: debug
  rules:
    - if: $CI_COMMIT_REF_NAME == "main-disabled"

secret_detection:
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: 'true'

pnpm:install:
  image:
    name: node:${NODE_VERSION}-alpine
  stage: .pre
  interruptible: true
  variables:
    CACHE_FALLBACK_KEY: $CI_DEFAULT_BRANCH
  before_script:
    - npm install --global corepack@latest
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile --prefer-offline
  script:
    - pnpm --version
  cache:
    key:
      files:
        - package.json
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

# prepare git env to push new code to scalingo
.scalingo:
  image: ubuntu:latest
  before_script:
    - apt-get update
    - apt-get -y install bash curl git openssh-client
    - curl -O https://cli-dl.scalingo.com/install && bash install
    - scalingo login --api-token $SCALINGO_API_TOKEN
    - mkdir -p ~/.ssh
    - eval $(ssh-agent -s)
    - echo "$SCALINGO_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - echo $SCALINGO_SSH_HOST && ssh-keyscan $SCALINGO_SSH_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - git config user.name $GIT_USER_NAME
    - git config user.email $GIT_USER_EMAIL
    - git remote add scalingo $SCALINGO_GIT_REMOTE || true
    - git fetch origin $CI_COMMIT_BRANCH --unshallow
    - scalingo --region $SCALINGO_REGION --app $SCALINGO_APP_NAME env-set "NUXT_PUBLIC_VERSION_COMMIT_SHA=$CI_COMMIT_SHA"
    - scalingo --region $SCALINGO_REGION --app $SCALINGO_APP_NAME env-set "NUXT_PUBLIC_VERSION_COMMIT_REF_NAME=$CI_COMMIT_REF_NAME"
    - |
      if [ -n "$CI_COMMIT_TAG" ]
      then
        scalingo --region $SCALINGO_REGION --app $SCALINGO_APP_NAME env-set "NUXT_PUBLIC_VERSION_COMMIT_TAG=$CI_COMMIT_TAG"
      fi

pnpm:lint:
  extends: pnpm:install
  stage: test
  cache:
    policy: pull
  script:
    - pnpm lint

pnpm:test:
  extends: ['pnpm:install']
  needs: ['pnpm:install']
  stage: test
  services:
    - name: postgres:${POSTGRES_VERSION}-alpine
      alias: database
      variables:
        POSTGRES_DB: mss
        POSTGRES_USER: mss
        POSTGRES_PASSWORD: password
        POSTGRES_PORT: 5432
  variables:
    DATABASE_URL: postgresql://mss:password@database:5432/mss
    APP_URL: http://localhost:3000
  script:
    - if [[ ! -e /lib/libssl.so.3 ]]; then ln -s /usr/lib/libssl.so.3 /lib/libssl.so.3; else echo "Link already exists"; fi
    - pnpm prisma migrate deploy
    - pnpm prisma db seed
    - pnpm run --if-present test --coverage
  cache:
    policy: pull
  artifacts:
    paths:
      - coverage
    expire_in: 1 week

deploy:scalingo-dev:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: development
  only:
    - main
  script:
    - git checkout $CI_COMMIT_BRANCH
    - git push scalingo $CI_COMMIT_BRANCH:main -f

deploy:scalingo-demo:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: demo
  only:
    - tags
  script:
    - git checkout tags/$CI_COMMIT_TAG -b latest
    - git push scalingo latest:main -f

deploy:scalingo-prod:
  stage: deploy
  extends:
    - .scalingo
  environment:
    name: production
  when: manual
  needs: ['deploy:scalingo-demo']
  only:
    - tags
  script:
    - git checkout tags/$CI_COMMIT_TAG -b latest
    - git push scalingo latest:main -f
