stages:
  - build
  - test
  - deploy
  - dast

include:
  - project: vigigloo/gitlab-pipeline-fragments
    ref: v1
    file:
      # build
      - /docker.auto.yml

      # test
      - /proxy/license-scanning.yml
      - /proxy/code-quality.yml
      - /proxy/dependency-scanning.yml
      - /proxy/container-scanning.yml
      - /proxy/sast.yml
      - /proxy/secret-scanning.yml
      - /pnpm.auto.yml

      # deploy
      - /helm.development.auto.yml
      - /helm.production.auto.yml

variables:
  HELM_CHART: nodejs
  HELM_REPOSITORY: https://gitlab.com/api/v4/projects/29298483/packages/helm/stable
  HELM_NAME: app
  HOST: ${BASE_DOMAIN}
  HELM_INGRESS_HOST: ${HOST}
  HELM_ENV_VAR_NUXT_PUBLIC_APP_URL: https://${HOST}

.vigigloo:pnpm:install:
  image:
    name: registry.gitlab.com/vigigloo/tools/pnpm:node-18_pnpm-8.6.2

.vigigloo:helm:deploy:
  variables:
    HELM_UPGRADE_EXTRA_ARGS: >-
      --set "jobs.hooks.postInstall[0].image.repository=${CI_APPLICATION_REPOSITORY}-migrations"
      --set "jobs.hooks.postInstall[0].image.tag=${CI_APPLICATION_TAG}"
      --set "jobs.hooks.preUpgrade[0].image.repository=${CI_APPLICATION_REPOSITORY}-migrations"
      --set "jobs.hooks.preUpgrade[0].image.tag=${CI_APPLICATION_TAG}"
deploy:production:
  variables:
    HELM_UPGRADE_EXTRA_ARGS: >-
      --set "jobs.hooks.postInstall[0].image.repository=${CI_APPLICATION_REPOSITORY}/migrations"
      --set "jobs.hooks.postInstall[0].image.tag=${CI_APPLICATION_TAG}"
      --set "jobs.hooks.preUpgrade[0].image.repository=${CI_APPLICATION_REPOSITORY}/migrations"
      --set "jobs.hooks.preUpgrade[0].image.tag=${CI_APPLICATION_TAG}"

.vigigloo:docker:kaniko:build:
  variables:
    DOCKER_BUILD_ARG_COMMIT_SHA: $CI_COMMIT_SHA
    DOCKER_BUILD_ARG_COMMIT_REF_NAME: $CI_COMMIT_REF_NAME
    DOCKER_BUILD_ARG_COMMIT_TAG: $CI_COMMIT_TAG
  parallel:
    matrix:
      - CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG
      - CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE/$CI_COMMIT_REF_SLUG-migrations
        DOCKERFILE: $CI_PROJECT_DIR/prisma/Dockerfile

docker:kaniko:build:production:
  parallel:
    matrix:
      - CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE
      - CI_APPLICATION_REPOSITORY: $CI_REGISTRY_IMAGE/migrations
        DOCKERFILE: $CI_PROJECT_DIR/prisma/Dockerfile

.playwright-pnpm:install:
  variables:
    CACHE_FALLBACK_KEY: $CI_DEFAULT_BRANCH
  image: mcr.microsoft.com/playwright:v1.44.0-jammy
  cache:
    key: $CI_COMMIT_REF_SLUG
    paths:
      - node_modules/.pnpm
  before_script:
    - npm install -g pnpm@8.6.2
    - pnpm install --frozen-lockfile --prefer-offline

.playwright:test:
  extends: .playwright-pnpm:install
  stage: test
  cache:
    policy: pull
  artifacts:
    paths:
      - playwright/reporter
    expire_in: 1 week

playwright:install:
  extends: .playwright-pnpm:install
  stage: .pre
  interruptible: true
  script:
    - pnpm --version
    - node --version

pnpm:test:e2e:
  extends: .playwright:test
  needs: ['playwright:install']
  services:
    - name: postgres:14.12-alpine
      alias: database
      variables:
        POSTGRES_DB: mss
        POSTGRES_USER: mss
        POSTGRES_PASSWORD: password
        POSTGRES_PORT: 5432
  variables:
    DATABASE_URL: postgresql://mss:password@database:5432/mss
    APP_URL: http://localhost:3000
  script:
    - pnpm prisma migrate deploy
    - pnpm prisma db seed
    - pnpm run --if-present test:e2e
  rules:
    - if: '$CI_COMMIT_BRANCH == "exploration/ci-integration"'

deploy:demo:
  extends:
    - deploy:production
  environment:
    name: demo
    on_stop: deploy:demo:uninstall
deploy:demo:uninstall:
  extends:
    - deploy:production:uninstall
  environment:
    name: demo
