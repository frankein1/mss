services:
  db:
    image: postgres:16.11-alpine
    container_name: monsuivisocial_pg
    shm_size: 500m
    environment:
      - POSTGRES_DB=$DB_DATABASE
      - POSTGRES_USER=$DB_USER
      - POSTGRES_PASSWORD=$DB_PASSWORD
    ports:
      - '$DB_PORT:5432'
    volumes:
      - monsuivisocial_pgdata:/var/lib/postgresql/data
    networks:
      - monsuivisocial_network
    restart: always
  s3:
    image: rustfs/rustfs:latest
    container_name: monsuivisocial_s3
    environment:
      - RUSTFS_ACCESS_KEY=$NUXT_S3_ACCESS_KEY_ID
      - RUSTFS_SECRET_KEY=$NUXT_S3_SECRET_ACCESS_KEY
      - RUSTFS_CONSOLE_ENABLE=true
    ports:
      - '$S3_PORT:9000' # S3 API port
      - '$S3_CONSOLE_PORT:9001' # Console port
    volumes:
      - monsuivisocial_s3data:/data
    networks:
      - monsuivisocial_network
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health'
        ]
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 0s
    restart: unless-stopped
  rustfs-seed:
    # Creates a local bucket if not exists when the S3 container is up and running
    image: rustfs/rc:latest
    container_name: monsuivisocial_s3_bucket_creation
    depends_on:
      s3:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/rc alias set local http://s3:9000 $NUXT_S3_ACCESS_KEY_ID $NUXT_S3_SECRET_ACCESS_KEY) do echo '...waiting...' && sleep 1; done;
      /usr/bin/rc mb --ignore-existing local/$NUXT_S3_BUCKET;
      echo 'RustFS bucket creation complete';
      "
    networks:
      - monsuivisocial_network
  kms:
    image: openbao/openbao:2.5.1
    container_name: monsuivisocial_kms
    environment:
      - KMS_UNSEAL_KEY=$KMS_UNSEAL_KEY
    ports:
      - '$KMS_PORT:8200'
    cap_add:
      # Prevents sensitive cryptographic data (encryption keys, tokens) from being swapped to disk
      - IPC_LOCK
    volumes:
      - ./docker:/config:ro
      - monsuivisocial_kmsdata:/openbao/file
    command: ['server', '-config=/config/openbao.dev.hcl']
    healthcheck:
      test: ['CMD', 'bao', 'status', '-address=http://127.0.0.1:8200']
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 0s
    restart: unless-stopped
    networks:
      - monsuivisocial_network

volumes:
  monsuivisocial_pgdata:
    name: monsuivisocial_pgdata
  monsuivisocial_s3data:
    name: monsuivisocial_s3data
  monsuivisocial_kmsdata:
    name: monsuivisocial_kmsdata

networks:
  monsuivisocial_network:
    external: false
    name: monsuivisocial_network
