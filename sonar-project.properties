sonar.organization=incubateur-territoires
sonar.projectKey=incubateur-territoires_monsuivisocial-v2

sonar.sources=.
sonar.exclusions=prisma/**,pnpm-lock.yaml,scripts/**,components/**/*.story.*,./*.config.*,**/stories.vue
sonar.tests=.
sonar.test.inclusions=test/**,e2e/**,**/*.spec.ts,**/__mocks__/**,**/__fixtures__/**

# Coverage: The essential requirements are that the tool produces its report in the LCOV format and writes it to a place from which the scanner can then pick it up.
sonar.javascript.lcov.reportPaths=./coverage/lcov.info
